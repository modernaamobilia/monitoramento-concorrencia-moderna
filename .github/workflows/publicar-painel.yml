name: Publicar interface do painel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - buybox_template.html
      - panel_*.js
      - build_html.mjs
      - .github/workflows/publicar-painel.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publicar-interface
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node build_html.mjs
      - run: node --test tests/*.test.mjs
      - run: |
          mkdir -p _site
          cp index.html Comparativo_por_Concorrente_09-11-2026.xlsx _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
