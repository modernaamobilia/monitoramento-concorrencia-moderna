name: Coleta diária de preços e fretes
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *' # 07h17 America/Sao_Paulo (UTC-3)
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coleta-diaria
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-calc
      - run: node --test tests/*.test.mjs
      - run: node collector.mjs
      - run: node build_html.mjs
      - run: node --test tests/*.test.mjs
      - run: python update_excel.py
      - run: libreoffice -env:UserInstallation=file:///tmp/lo-moderna --headless --convert-to xlsx --outdir .excel-tmp Comparativo_por_Concorrente_09-11-2026.xlsx
      - run: python verify_excel.py .excel-tmp/Comparativo_por_Concorrente_09-11-2026.xlsx
      - run: mv .excel-tmp/Comparativo_por_Concorrente_09-11-2026.xlsx Comparativo_por_Concorrente_09-11-2026.xlsx
      - name: Preservar dados no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados_revisados.json historico_cotacoes.json variantes_aprovadas.json ultima_coleta.json coletas index.html Comparativo_por_Concorrente_09-11-2026.html Comparativo_por_Concorrente_09-11-2026.xlsx
          git diff --cached --quiet || git commit -m "Atualizar cotações, histórico, painel e Excel"
          git push
      - name: Montar publicação
        run: |
          mkdir -p _site
          cp index.html Comparativo_por_Concorrente_09-11-2026.xlsx _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-coleta
          include-hidden-files: true
          path: |
            ultima_coleta.json
            coletas/
            .excel-tmp/
