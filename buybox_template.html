const money=v=>typeof v==='number'?fmt.format(v):'—';
const cents=v=>Math.round((v+Number.EPSILON)*100)/100;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function anchor(url,label,cls=''){return /^https:\/\//.test(url)?'<a class="'+cls+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':esc(label);}
const date=s=>s?s.split('-').reverse().join('/'):'—';
function shipping(p,d){const s=DATA.ship[p.id],freight=s.freights[d],valid=typeof freight==='number'&&(!DATA.automation||(s.lastAttempt?.[d]?.status==='ok'&&(s.lastAttempt[d].at===DATA.automation.checkedAt||s.lastAttempt[d].source==='browser_assisted')&&s.collectedAt?.[d]===DATA.automation.date&&p.priceCollectedAt===DATA.automation.date));return{freight:valid?freight:null,valid,total:valid?cents(p.price+freight):null,prazo:valid?s.dates[d]?(s.start[d]?date(s.start[d])+' a '+date(s.dates[d]):'Até '+date(s.dates[d])):s.du[d]+' dias úteis':DATA.automation?(s.lastAttempt?.[d]?.status==='unavailable'?'Sem entrega para este CEP':'Falha na coleta · consultar histórico'):['T1','A3'].includes(p.id)?'Sem método de envio':'CEP rejeitado'};}
function analyze(ref,d){const mod=P.get('M'+(ref+1)),ms=shipping(mod,d),eligible=DATA.products.filter(p=>p.ref===ref&&ACCEPTED.has(p.id));const competitors=eligible.map(p=>({p,s:shipping(p,d)})).filter(x=>x.s.valid).sort((a,b)=>a.s.total-b.s.total);const best=competitors[0];const status=!eligible.length?'none':!ms.valid||!best?'missing':ms.total>best.s.total?'lost':ms.total<best.s.total?'won':'tie';const winner=best&&ms.valid?(ms.total<=best.s.total?{p:mod,s:ms}:best):null;const gap=best?Math.max(0,cents(ms.total-best.s.total)):null;return{ref,d,mod,ms,best,winner,status,gap,priceDelta:best?cents(mod.price-best.p.price):null,freightDelta:best?cents(ms.freight-best.s.freight):null,reduction:status==='lost'?cents(gap+.01):null,priceTarget:status==='lost'?cents(best.s.total-ms.freight-.01):null,freightTarget:status==='lost'?cents(best.s.total-mod.price-.01):null};}
const ALL=Array.from({length:5},(_,r)=>DEST.map((_,d)=>analyze(r,d)));
const count=(r,s)=>ALL[r].filter(x=>x.status===s).length;
const losses=ALL.flat().filter(x=>x.status==='lost').sort((a,b)=>b.gap-a.gap);
let state={ref:null,d:5,onlyLost:false,alternatives:false};
const statusLabel=s=>({lost:'Concorrente vence',won:'Moderna vence',tie:'Empate',none:'Sem concorrente próximo',missing:'Sem frete concorrente'}[s]);
const statusTag=s=>'<span class="tag '+(s==='lost'?'alert':s==='won'?'good':'dim')+'">'+statusLabel(s)+'</span>';
const city=d=>'<span class="city">'+DEST[d][0]+'<span class="cep">'+DEST[d][1]+' · '+DEST[d][2]+'</span></span>';
function metric(label,value,note,kind=''){return '<div class="metric '+kind+'"><span>'+label+'</span><strong>'+value+'</strong><span>'+note+'</span></div>';}
function navigation(){document.getElementById('navigation').innerHTML='<button class="tab" data-action="overview" aria-pressed="'+(state.ref===null)+'">Visão geral</button>'+NAMES.map((n,r)=>'<button class="tab" data-action="product" data-ref="'+r+'" aria-pressed="'+(state.ref===r)+'">'+esc(n)+(count(r,'lost')?'<span class="count">'+count(r,'lost')+' CEPs</span>':'')+'</button>').join('');}
function overview(){const won=ALL.flat().filter(x=>x.status==='won').length;const missing=ALL.flat().filter(x=>['none','missing'].includes(x.status)).length;return '<p class="notice">Menor custo entregue entre anúncios comparáveis e cotados. Ofertas parciais e lacunas de frete ficam separadas; não representam vitória comprovada da Moderna.</p><div class="section-title"><div><h2>Onde concentrar a análise</h2><p class="subtle">'+(DATA.automation?'Coleta de '+date(DATA.automation.date):'Base de 09/11/2026; atualização em 10/11/2026')+'</p></div></div><div class="grid metrics">'+metric('Concorrente vence',losses.length,'combinações de produto e CEP','alert')+metric('Moderna vence',won,'combinações comparáveis cotadas','good')+metric('Maior diferença no total',losses[0]?money(losses[0].gap):'—',losses[0]?NAMES[losses[0].ref]+' · '+DEST[losses[0].d][0]:'nenhuma perda confirmada')+metric('Comparação não concluída',missing,'comparações sem cotação completa')+'</div><div class="grid products">'+[4,3,0,1,2].map(r=>'<button class="product-card" data-action="product" data-ref="'+r+'"><strong>'+esc(NAMES[r])+'</strong><div class="value '+(count(r,'lost')?'alert-text':'')+'">'+count(r,'lost')+' <small style="font-size:12px;letter-spacing:0;font-weight:400">CEPs perdidos</small></div><p>'+esc(focusSummary(r))+'</p><span>Ver análise do produto →</span></button>').join('')+'</div><section class="panel"><div class="section-title"><div><h2>Concorrentes que estão ganhando</h2><p class="subtle">Ordenado pela diferença no total. Clique em “Analisar” para abrir o produto e CEP.</p></div><span class="tag alert">'+losses.length+' oportunidades</span></div><div class="table-wrap"><table><thead><tr><th>Produto / destino</th><th>Anúncio ganhador</th><th class="num">Produto</th><th class="num">Frete</th><th class="num">Total concorrente</th><th class="num">Total Moderna</th><th class="num">Moderna perde por</th><th></th></tr></thead><tbody>'+losses.map(a=>'<tr><td><strong>'+esc(NAMES[a.ref])+'</strong><span class="cep">'+esc(DEST[a.d][0])+' · '+DEST[a.d][1]+'</span></td><td class="offer-name">'+anchor(a.best.p.url,a.best.p.store+' / '+a.best.p.model)+'<span class="cep">CEP '+actualCep(a.best.p,a.d)+(actualCep(a.best.p,a.d)!==actualCep(a.mod,a.d)?' · diferente da Moderna ('+actualCep(a.mod,a.d)+')':'')+'</span></td><td class="num">'+money(a.best.p.price)+'</td><td class="num">'+money(a.best.s.freight)+'</td><td class="num money-strong">'+money(a.best.s.total)+'</td><td class="num">'+money(a.ms.total)+'</td><td class="num alert-text">'+money(a.gap)+'</td><td><button class="text-button" data-action="analyze" data-ref="'+a.ref+'" data-d="'+a.d+'">Analisar CEP</button></td></tr>').join('')+'</tbody></table></div></section><details class="method"><summary>Critério da análise</summary><div class="inside"><p>O ganhador é o menor preço do produto + frete para uma unidade, na condição Pix/à vista. Não foram aplicados cupons adicionais, cashback, montagem ou garantia. A posição real de buybox na plataforma não foi verificada.</p><p>O MDF foi priorizado. Apogeu, Vênus, mesa 5388 e Easy Like foram incluídos com ressalvas explícitas. O Neo 280 fica na análise individual, fora da disputa principal por diferenças de material e configuração. Os critérios são os mesmos da versão Excel.</p><p>A pesquisa tem 23 anúncios pesquisados, 184 combinações com CEP e '+(DATA.automation?DATA.automation.ok:144)+' fretes confirmados. A análise principal considera os anúncios elegíveis; por isso seu número de disputas concluídas é menor.</p></div></details>';}
function winnerRows(ref){let list=ALL[ref].filter(a=>!state.onlyLost||a.status==='lost');if(!list.length)return '<tr><td colspan="7" class="empty">Nenhum concorrente vence nos CEPs comparáveis cotados deste produto.</td></tr>';return list.map(a=>'<tr class="'+(state.d===a.d?'row-selected':'')+'"><td>'+city(a.d)+'</td><td class="offer-name">'+(a.winner?anchor(a.winner.p.url,a.winner.p.store+' / '+a.winner.p.model):'<span class="subtle">'+statusLabel(a.status)+'</span>')+'</td><td class="num money-strong">'+money(a.winner?.s.total)+'</td><td class="num">'+money(a.ms.total)+'</td><td class="num '+(a.gap>0?'alert-text':'')+'">'+money(a.gap)+'</td><td>'+statusTag(a.status)+'</td><td><button class="text-button" data-action="select-cep" data-d="'+a.d+'">Analisar CEP</button></td></tr>').join('');}
function offerCard(p,s,isMod,a){const wins=a.winner?.p.id===p.id;const label=wins?(a.status==='tie'?'Empate no menor total':isMod?'Menor custo entregue':'Ganha em preço + frete'):isMod?'Nossa oferta':'Melhor concorrente cotado';const max=Math.max(a.ms.total,a.best?.s.total??0);const bar=s.valid?'<div class="bar" aria-label="Produto '+money(p.price)+' e frete '+money(s.freight)+'"><span class="product-part" style="width:'+(p.price/max*100)+'%"></span><span class="freight-part" style="width:'+(s.freight/max*100)+'%"></span></div><div class="legend"><span>Produto</span><span>Frete</span></div>':'';return '<article class="offer-card '+(wins?isMod?'mod-win':'win':'')+'"><div class="card-head"><div><h3>'+esc(p.store)+' / '+esc(p.model)+'</h3><div class="seller">Vendido por '+esc(p.seller)+'</div></div><span class="tag '+(wins?isMod?'good':'alert':'dim')+'">'+label+'</span></div><div class="costline"><span>Preço do produto</span><strong>'+money(p.price)+'</strong></div><div class="costline"><span>Frete</span><strong>'+money(s.freight)+'</strong></div><div class="costline total"><span>Total entregue</span><strong>'+money(s.total)+'</strong></div>'+bar+'<div class="delivery"><strong>'+esc(s.prazo)+'</strong><span>Prazo exibido pela loja; datas e dias úteis não foram convertidos.</span></div><div class="link-row">'+anchor(p.url,'Abrir anúncio ↗','btn')+(QUALIFIED.has(p.id)?'<span class="tag dim">Comparável com ressalva</span>':'')+'</div><p class="technical">'+esc(p.mat)+' · '+p.dims.map(v=>v===null?'não informado':String(v).replace('.',',')).join(' × ')+' cm (A × L × P)</p><p class="technical">'+esc(p.note)+'</p></article>';}
function deltaText(label,v){return '<span><span class="subtle">'+label+': </span><strong class="'+(v>0?'alert-text':'good-text')+'">Moderna '+money(Math.abs(v))+' '+(v>0?'mais cara':v<0?'mais barata':'sem diferença')+'</strong></span>';}
function opportunity(a){if(a.status==='lost')return '<div class="opportunity"><h3>Quanto ajustar para superar esta oferta</h3><p>A Moderna está <strong>'+money(a.gap)+'</strong> acima do melhor concorrente neste CEP.</p><div class="difference">'+deltaText('Produto',a.priceDelta)+deltaText('Frete',a.freightDelta)+'</div><div class="grid"><div class="target"><label>Redução mínima no total</label><strong>'+money(a.reduction)+'</strong><small>Para superar o concorrente em R$ 0,01.</small></div><div class="target"><label>Se ajustar apenas o produto</label><strong>'+money(a.priceTarget)+'</strong><small>Preço alvo, mantendo o frete atual de '+money(a.ms.freight)+'.</small></div><div class="target"><label>Se ajustar apenas o frete</label><strong>'+(a.freightTarget<0?'Frete sozinho não resolve':money(a.freightTarget))+'</strong><small>'+(a.freightTarget<0?'Mesmo frete grátis não supera o total concorrente.':'Frete alvo, mantendo o produto a '+money(a.mod.price)+'.')+'</small></div></div><p class="small" style="margin-bottom:0">São cenários independentes. Não aplicar os dois ajustes ao mesmo tempo. Alvos aritméticos; validar margem antes de definir a campanha.</p></div>';if(a.status==='won')return '<div class="positive"><strong>A Moderna já tem o menor custo entregue neste CEP.</strong><p style="margin-bottom:0">Vantagem de '+money(cents(a.best.s.total-a.ms.total))+' sobre o concorrente comparável mais barato. O prazo de entrega permanece visível nas duas ofertas.</p></div>';if(a.status==='tie')return '<div class="neutral"><strong>Empate no custo entregue.</strong><p style="margin-bottom:0">O resumo exibe a Moderna. Prazo e condições do anúncio ajudam a analisar a diferenciação.</p></div>';return '<div class="neutral"><strong>'+statusLabel(a.status)+'.</strong><p style="margin-bottom:0">'+(a.status==='none'?'Não atribuímos vitória à Moderna sem um similar próximo. As alternativas ficam separadas abaixo.':'O concorrente elegível não retornou frete para este CEP. A ausência de frete não significa frete grátis.')+'</p></div>';}
function offersTable(ref,d){const a=ALL[ref][d],items=DATA.products.filter(p=>p.ref===ref&&(p.store==='Moderna'||ACCEPTED.has(p.id)||state.alternatives));return '<div class="table-wrap"><table><thead><tr><th>Anúncio</th><th>Material / medidas</th><th class="num">Produto</th><th class="num">Frete</th><th class="num">Total</th><th>Prazo</th><th>Participação</th></tr></thead><tbody>'+items.map(p=>{const s=shipping(p,d),eligible=p.store==='Moderna'||ACCEPTED.has(p.id),win=eligible&&a.winner&&s.valid&&s.total===a.winner.s.total;return '<tr class="'+(!eligible?'muted-row':win?'win-row':'')+'"><td class="offer-name">'+anchor(p.url,p.store+' / '+p.model)+'<small>'+esc(p.seller)+'</small></td><td>'+esc(p.mat)+'<span class="cep">'+p.dims.map(v=>v===null?'?':String(v).replace('.',',')).join(' × ')+' cm</span></td><td class="num">'+money(p.price)+'</td><td class="num">'+money(s.freight)+'</td><td class="num '+(win?'money-strong good-text':'')+'">'+money(s.total)+(win?'<span class="cep good-text">MENOR TOTAL</span>':'')+'</td><td>'+esc(s.prazo)+'</td><td><span class="tag '+(!eligible?'dim':win?'good':'dim')+'">'+(!eligible?'Fora da disputa':p.store==='Moderna'?'Referência':QUALIFIED.has(p.id)?'Com ressalva':'Comparável')+'</span></td></tr>';}).join('')+'</tbody></table></div>';}
function methodology(ref){const exclusions=DATA.excluded.filter(e=>e[1]===ref),coverage=DATA.coverage.filter(c=>c[0]===ref);return '<details class="method"><summary>Ver critérios técnicos, cobertura e anúncios descartados</summary><div class="inside"><p>'+esc(NOTES[ref])+'</p><div class="table-wrap"><table><thead><tr><th>Site</th><th>Resultado da busca</th></tr></thead><tbody>'+coverage.map(c=>'<tr><td>'+esc(c[1])+'</td><td>'+esc(c[3])+'</td></tr>').join('')+'</tbody></table></div>'+(exclusions.length?'<h3 style="margin-top:20px">Anúncios descartados</h3><ul>'+exclusions.map(e=>'<li>'+anchor(e[7],e[2]+' / '+e[3])+': <strong>'+esc(e[4])+'</strong>. '+esc(e[6])+'</li>').join('')+'</ul>':'')+'<p>Ganhador significa o menor preço + frete observado entre os comparáveis, sem comprovação da posição real do anúncio na plataforma. Preços são Pix/à vista para uma unidade, sem cupons adicionais ou serviços.</p></div></details>';}
function product(ref){const mod=P.get('M'+(ref+1)),a=ALL[ref][state.d],na=count(ref,'none')+count(ref,'missing');return '<div class="section-title"><div><h2>'+esc(NAMES[ref])+'</h2><p class="subtle">Referência Moderna: '+esc(mod.mat)+' · '+mod.dims.map(v=>String(v).replace('.',',')).join(' × ')+' cm (A × L × P) · produto '+money(mod.price)+'</p></div>'+anchor(mod.url,'Abrir anúncio Moderna ↗','btn')+'</div><p class="notice">'+esc(NOTES[ref])+'</p><div class="grid metrics">'+metric('Concorrente vence',count(ref,'lost'),'dos oito CEPs analisados','alert')+metric('Moderna vence',count(ref,'won'),'comparações concluídas','good')+metric('Sem disputa ou frete',na,'sem vitória presumida')+metric('Maior perda confirmada',Math.max(...ALL[ref].map(x=>x.gap??0))>0?money(Math.max(...ALL[ref].map(x=>x.gap??0))):'—','diferença no custo entregue')+'</div><section class="panel"><div class="section-title"><div><h2>Quem ganha em cada CEP</h2><p class="subtle">O menor total decide o resultado; o prazo fica disponível na análise individual.</p></div><label class="small no-print"><input id="onlyLost" type="checkbox" '+(state.onlyLost?'checked':'')+'> Somente CEPs perdidos</label></div><div class="table-wrap"><table><thead><tr><th>Destino</th><th>Anúncio ganhador</th><th class="num">Total ganhador</th><th class="num">Total Moderna</th><th class="num">Moderna perde por</th><th>Resultado</th><th></th></tr></thead><tbody>'+winnerRows(ref)+'</tbody></table></div></section><section id="cep-detail" class="panel"><div class="section-title"><div><h2>'+esc(DEST[state.d][0])+' · '+DEST[state.d][1]+'</h2><p class="subtle">Preço, frete e prazo lado a lado.</p></div><div class="toolbar" style="margin:0"><label for="cepSelect">Selecionar CEP <select id="cepSelect">'+DEST.map((x,d)=>'<option value="'+d+'" '+(d===state.d?'selected':'')+'>'+esc(x[0])+' · '+x[1]+'</option>').join('')+'</select></label></div></div><div class="grid offers">'+offerCard(mod,a.ms,true,a)+(a.best?offerCard(a.best.p,a.best.s,false,a):'<article class="offer-card"><h3>'+statusLabel(a.status)+'</h3><p class="subtle" style="margin-top:18px">'+(a.status==='none'?'Não foi confirmado um concorrente próximo para a disputa principal.':'O frete do concorrente elegível não foi obtido para este CEP.')+'</p><p class="technical">Confira a cobertura e as alternativas pesquisadas abaixo.</p></article>')+'</div>'+opportunity(a)+'</section><section class="panel"><div class="section-title"><div><h2>Ofertas deste CEP</h2><p class="subtle">Links diretos para conferir o anúncio e suas características.</p></div><label class="small no-print"><input id="alternatives" type="checkbox" '+(state.alternatives?'checked':'')+'> Mostrar alternativas fora da disputa</label></div>'+offersTable(ref,state.d)+'<p class="aside-note">Frete ausente permanece sem total. Alternativas fora da disputa não alteram o ganhador, mesmo quando têm preço menor.</p></section>'+methodology(ref);}
function competitorMap(ref){const slots=DATA.comparison.filter(x=>x.ref===ref),filled=slots.filter(x=>x.id).length;return '<section aria-label="Um anúncio por concorrente"><div class="section-title"><div><h2>Um anúncio por concorrente</h2><p class="subtle">Todos aparecem aqui, independentemente de ganhar em preço + frete.</p></div><span class="coverage-progress">'+filled+' de 4 com anúncio para análise</span></div><div class="grid competitor-grid">'+slots.map((slot,i)=>{const p=P.get(slot.id);return '<article class="competitor-slot '+(!p?'pending':'')+'" data-slot="'+ref+'-'+i+'"><div class="card-head"><span class="slot-heading">'+esc(slot.store)+'</span><span class="tag '+(!p?'alert':'dim')+'">'+esc(slot.status)+'</span></div><h3>'+esc(p?p.model:'Aguardando sua indicação')+'</h3>'+(p?'<p class="small">'+esc(p.mat)+' · '+p.dims.map(v=>v===null?'medida não informada':String(v).replace('.',',')).join(' × ')+' cm<br>Produto: <strong>'+money(p.price)+'</strong></p>':'')+'<p class="small">'+esc(slot.note)+'</p><div class="link-row">'+(p?anchor(p.url,'Abrir anúncio ↗','btn'):'<span class="tag alert">Anúncio a definir</span>')+'<button class="text-button" data-action="store-detail" data-slot-index="'+i+'">'+(p?'Ver comparação nos 8 CEPs':'Ver pendência')+'</button></div></article>';}).join('')+'</div></section>';}
function storesAnalysis(ref){return '<section aria-label="Análise separada dos quatro concorrentes"><div class="section-title"><div><h2>Análise separada por concorrente</h2><p class="subtle">Cada anúncio contra a Moderna nos oito CEPs. As alternativas parciais ficam identificadas e não mudam a disputa principal.</p></div></div>'+DATA.comparison.filter(x=>x.ref===ref).map((slot,i)=>{const p=P.get(slot.id),m=P.get('M'+(ref+1));return '<section class="panel store-section" id="store-slot-'+ref+'-'+i+'"><div class="section-title"><div><h3>'+esc(slot.store)+' / '+esc(p?p.model:'anúncio a definir')+'</h3><p class="subtle small">'+esc(slot.status)+'. '+esc(slot.note)+'</p></div>'+(p?anchor(p.url,'Abrir anúncio ↗','btn'):'<span class="tag alert">Aguardando sua indicação</span>')+'</div>'+(p?'<div class="table-wrap"><table><thead><tr><th>Destino</th><th class="num">Produto concorrente</th><th class="num">Frete concorrente</th><th class="num">Total concorrente</th><th class="num">Produto Moderna</th><th class="num">Frete Moderna</th><th class="num">Total Moderna</th><th>Prazo concorrente</th><th>Resultado individual</th></tr></thead><tbody>'+DEST.map((_,d)=>{const s=shipping(p,d),ms=shipping(m,d),lower=s.valid&&ms.valid&&s.total<ms.total,partial=!ACCEPTED.has(p.id);return '<tr><td>'+storeCity(d,p,m)+'</td><td class="num">'+money(p.price)+'</td><td class="num">'+money(s.freight)+'</td><td class="num '+(lower?'alert-text':'money-strong')+'">'+money(s.total)+'</td><td class="num">'+money(m.price)+'</td><td class="num">'+money(ms.freight)+'</td><td class="num">'+money(ms.total)+'</td><td>'+esc(s.prazo)+'</td><td><span class="tag '+(lower?'alert':'dim')+'">'+(!s.valid?'Frete não obtido':!ms.valid?'Moderna sem cotação':lower?partial?'Parcial menor':'Concorrente menor':s.total===ms.total?'Empate':'Moderna menor')+'</span></td></tr>';}).join('')+'</tbody></table></div>':'<div class="neutral"><strong>Sem similar adequado confirmado.</strong><p>Envie o link do anúncio que deseja usar para esta comparação. Preço, frete e prazo não foram estimados.</p></div>')+'</section>';}).join('')+'</section>';}
function pendingOverview(){const list=DATA.comparison.filter(x=>!x.id);return '<section class="panel"><div class="section-title"><div><h2>Anúncios a definir por você</h2><p class="subtle">Não foi confirmado similar adequado nestes '+list.length+' campos da pesquisa. Envie os links que deseja usar.</p></div><span class="tag alert">'+list.length+' pendências</span></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Concorrente</th><th>Motivo / próximo passo</th><th></th></tr></thead><tbody>'+list.map(x=>'<tr><td>'+esc(NAMES[x.ref])+'</td><td>'+esc(x.store)+'</td><td>'+esc(x.note)+'</td><td><button class="text-button" data-action="product" data-ref="'+x.ref+'">Ver produto</button></td></tr>').join('')+'</tbody></table></div></section>';}
const priorProduct=product,priorOverview=overview;
product=function(ref){return priorProduct(ref).replace('<div class="grid metrics">',competitorMap(ref)+'<div class="grid metrics">').replace('<details class="method">',storesAnalysis(ref)+'<details class="method">');};
overview=function(){return priorOverview()+pendingOverview();};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="store-detail"]');if(b)document.getElementById('store-slot-'+state.ref+'-'+b.dataset.slotIndex).scrollIntoView({behavior:'smooth'});});
function render(scroll=false){navigation();document.getElementById('app').innerHTML=state.ref===null?overview():product(state.ref);document.title=state.ref===null?'Moderna Mobília — concorrência por custo entregue':NAMES[state.ref]+' — preço + frete';if(scroll)window.scrollTo({top:0,behavior:'smooth'});}
function selectProduct(ref,d){state.ref=ref;state.onlyLost=false;state.alternatives=false;const worst=ALL[ref].filter(a=>a.status==='lost').sort((a,b)=>b.gap-a.gap)[0];state.d=d??worst?.d??0;render(true);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='overview'){state.ref=null;render(true);}if(action==='product')selectProduct(Number(b.dataset.ref));if(action==='analyze'){selectProduct(Number(b.dataset.ref),Number(b.dataset.d));document.getElementById('cep-detail').scrollIntoView({behavior:'smooth'});}if(action==='select-cep'){state.d=Number(b.dataset.d);render();document.getElementById('cep-detail').scrollIntoView({behavior:'smooth'});}});
document.addEventListener('change',e=>{if(e.target.id==='cepSelect'){state.d=Number(e.target.value);render();document.getElementById('cep-detail').scrollIntoView({behavior:'instant'});}if(e.target.id==='onlyLost'){state.onlyLost=e.target.checked;render();}if(e.target.id==='alternatives'){state.alternatives=e.target.checked;const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});}});
document.getElementById('print').addEventListener('click',()=>window.print());
render();
</script>
</body>
</html>
